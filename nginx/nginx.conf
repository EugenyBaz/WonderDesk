events {
    worker_connections 1024;
}
# TEST999
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:8000;
    }

    # Сервер для HTTP → редиректим всё на HTTPS
    server {
        listen 80;
        server_name wonderdesk.ru www.wonderdesk.ru;

        # нужно для certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Сервер для HTTPS
    server {
        listen 443 ssl;
        server_name wonderdesk.ru www.wonderdesk.ru;

        ssl_certificate /etc/letsencrypt/live/wonderdesk.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wonderdesk.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Раздача статики
        location /static/ {
            alias /app/staticfiles/;
        }

        # Раздача медиа
        location /media/ {
            alias /app/media/;
        }

        # Проброс запросов в Django (gunicorn в контейнере web)
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}